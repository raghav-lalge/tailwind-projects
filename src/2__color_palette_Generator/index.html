<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="../../../output.css">
</head>
<body>
    <div class=" min-h-screen bg-gradient-to-br from-blue-300 to-slate-300 flex justify-center items-center ">
        <div class="bg-white max-w-4xl w-full p-8 rounded-lg shadow-lg">
            
           <h1 class="font-bold text-xl text-center underline decoration-blue-400 decoration-2 underline-offset-4 pb-4">Color Palette Generator</h1>

           <button class="bg-gradient-to-r from-indigo-500 to-purple-600 text-base font-medium px-6 py-3 rounded-full text-white mb-8 hover:shadow-lg hover:-translate-y-1 transition duration-200">
            Generate Palette
            </button>
        
            <div class="grid grid-cols-5 gap-4">

                <div class="rounded-lg overflow-hidden shadow-sm hover:-translate-y-1 hover:shadow-md transition duration-200">

                    <div class="h-[120px] bg-purple-500"></div>

                    <div class="bg-white px-3 py-2 flex items-center justify-between">
                        <span class="font-medium text-sm tracking-wide">#7C5C8C</span>
                        <i class="far fa-copy text-gray-400 cursor-pointer"></i>


                    </div>
                </div>

                <div class="rounded-lg overflow-hidden shadow-sm hover:-translate-y-1 hover:shadow-md transition duration-200">

                    <div class="h-[120px] bg-green-500"></div>

                    <div class="bg-white px-3 py-2 flex items-center justify-between">
                        <span class="font-medium text-sm tracking-wide">#0ABD0B</span>
                        <i class="far fa-copy text-gray-400 cursor-pointer"></i>


                    </div>
                </div>

                <div class="rounded-lg overflow-hidden shadow-sm hover:-translate-y-1 hover:shadow-md transition duration-200">

                    <div class="h-[120px] bg-blue-500"></div>

                    <div class="bg-white px-3 py-2 flex items-center justify-between">
                        <span class="font-medium text-sm tracking-wide">#2506A7</span>
                        <i class="far fa-copy text-gray-400 cursor-pointer"></i>


                    </div>
                </div>

                <div class="rounded-lg overflow-hidden shadow-sm hover:-translate-y-1 hover:shadow-md transition duration-200">

                    <div class="h-[120px] bg-indigo-500"></div>

                    <div class="bg-white px-3 py-2 flex items-center justify-between">
                        <span class="font-medium text-sm tracking-wide">#2F1BAA</span>
                        <i class="far fa-copy text-gray-400 cursor-pointer"></i>


                    </div>
                </div>

                <div class="rounded-lg overflow-hidden shadow-sm hover:-translate-y-1 hover:shadow-md transition duration-200">

                    <div class="h-[120px] bg-pink-500"></div>

                    <div class="bg-white px-3 py-2 flex items-center justify-between">
                        <span class="font-medium text-sm tracking-wide">#E45779</span>
                        <i class="far fa-copy text-gray-400 cursor-pointer"></i>


                    </div>
                </div>

            </div>
        </div>

        



    </div>
    <script src="./script.js"></script>
    
</body>
</html>

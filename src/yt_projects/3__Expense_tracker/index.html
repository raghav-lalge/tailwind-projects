<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="../../../output.css" />
  </head>

  <body>
    <div
      class="min-h-screen bg-gradient-to-br from-green-500 to-green-300 flex justify-center items-center p-4"
    >
      <!-- Main Container -->
      <div
        class="bg-white w-full max-w-5xl p-6 md:p-8 rounded-2xl shadow-lg"
      >
        <!-- Title -->
        <h1
          class="text-center text-2xl md:text-3xl font-bold text-gray-800 mb-6"
        >
          Expense Tracker
        </h1>

        <!-- Balance Container -->
        <div
          class="bg-gradient-to-br from-green-200 to-green-600 rounded-xl p-5 text-center mb-6"
        >
          <!-- Balance -->
          <p class="text-sm text-gray-700">
            Your Balance
          </p>

          <h2
            id="balance"
            class="text-3xl md:text-4xl font-bold text-gray-800 my-2"
          >
            $0.00
          </h2>

          <!-- Income & Expenses -->
          <div
            class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5"
          >
            <!-- Income -->
            <div
              class="bg-white p-4 rounded-lg shadow-md"
            >
              <p class="text-sm font-medium text-green-600">
                Income
              </p>

              <p
                id="income-amount"
                class="text-xl font-bold text-green-600 mt-1"
              >
                $0.00
              </p>
            </div>

            <!-- Expenses -->
            <div
              class="bg-white p-4 rounded-lg shadow-md"
            >
              <p class="text-sm font-medium text-red-600">
                Expenses
              </p>

              <p
                id="expense-amount"
                class="text-xl font-bold text-red-600 mt-1"
              >
                $0.00
              </p>
            </div>
          </div>
        </div>

        <!-- Main Content -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6"
        >
          <!-- Transactions -->
          <div class="flex flex-col">
            <h2
              class="text-lg font-semibold text-gray-700 mb-4"
            >
              Transactions
            </h2>

            <ul
              id="transaction-list"
              class="space-y-3 max-h-96 overflow-y-auto pr-2"
            >
              <!-- Transactions will be added here -->
            </ul>
          </div>

          <!-- Add Transaction -->
          <div
            class="bg-gray-50 rounded-xl shadow-md p-5"
          >
            <h2
              class="text-lg font-semibold text-gray-700 mb-5"
            >
              Add Transaction
            </h2>

            <form id="transaction-form">

              <!-- Description -->
              <div class="mb-5">
                <label
                  for="description"
                  class="block text-sm font-medium text-gray-600 mb-2"
                >
                  Description
                </label>

                <input
                  type="text"
                  id="description"
                  placeholder="Enter description..."
                  required
                  class="w-full p-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-400"
                />
              </div>

              <!-- Amount -->
              <div class="mb-5">
                <label
                  for="amount"
                  class="block text-sm font-medium text-gray-600 mb-2"
                >
                  Amount
                </label>

                <input
                  type="number"
                  id="amount"
                  placeholder="Enter amount..."
                  required
                  class="w-full p-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-400"
                />

                <small
                  class="block text-sm text-gray-500 mt-1"
                >
                  Use negative (-) for expenses
                </small>
              </div>

              <!-- Button -->
              <button
                type="submit"
                class="w-full p-3 bg-gradient-to-r from-green-600 to-green-400 text-white font-medium rounded-lg shadow-md hover:-translate-y-0.5 hover:shadow-lg transition"
              >
                Add Transaction
              </button>

            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
